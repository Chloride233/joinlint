name: ci

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]' sqlglot==30.13.0
      - run: python -m ruff check src tests benchmarks scripts
      - run: python -m pytest -q
      - run: python scripts/run_benchmark.py --rows 1000000 --output performance.json
      - run: python -c "import json; result=json.load(open('performance.json')); assert result['elapsed_seconds'] <= 60 and result['peak_rss_bytes'] < 1073741824, result"
