name: ci

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]' sqlglot==30.13.0
      - run: python -m ruff check src tests benchmarks scripts
      - run: python -m pytest -q
      - run: python scripts/run_benchmark.py --rows 1000000 --output performance.json
      - run: python -c "import json; result=json.load(open('performance.json')); assert result['elapsed_seconds'] <= 60 and result['peak_rss_bytes'] < 1073741824, result"
