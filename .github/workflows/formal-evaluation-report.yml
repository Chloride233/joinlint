name: formal-evaluation-report

on:
  workflow_dispatch:
    inputs:
      formal_run_id:
        description: Completed formal-evaluation run ID
        required: true
        type: string
      frozen_inputs_run_id:
        description: Run ID holding the original frozen-input artifact
        required: true
        type: string
      review_run_id:
        description: Run ID holding the arm-blinded review measurement
        required: true
        type: string
      joinlint_commit:
        description: Exact preregistered JoinLint commit
        required: true
        type: string
      frozen_artifact_name:
        required: true
        default: joinlint-formal-inputs
        type: string
      review_artifact_name:
        required: true
        default: joinlint-formal-blind-review
        type: string

permissions:
  actions: read
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    environment: formal-evaluation
    env:
      JOINLINT_COMMIT: ${{ inputs.joinlint_commit }}
    steps:
      - name: Block report generation pending trusted evidence verification
        run: exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.joinlint_commit }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: formal-evaluation-sanitized
          path: formal-artifacts
          github-token: ${{ github.token }}
          run-id: ${{ inputs.formal_run_id }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ inputs.frozen_artifact_name }}
          path: benchmarks/formal_eval/sealed
          github-token: ${{ github.token }}
          run-id: ${{ inputs.frozen_inputs_run_id }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ inputs.review_artifact_name }}
          path: formal-review
          github-token: ${{ github.token }}
          run-id: ${{ inputs.review_run_id }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[dev,eval]'
      - name: Re-verify original frozen inputs
        run: >-
          python -m benchmarks.formal_eval.cli preflight
          --preregistration benchmarks/formal_eval/sealed/preregistration.yaml
          --manifest benchmarks/formal_eval/sealed/manifest.json
          --input-lock benchmarks/formal_eval/sealed/input-lock.json
          --inputs-root benchmarks/formal_eval/sealed
          --sealed-tasks benchmarks/formal_eval/sealed/agent-tasks.json
          --deterministic-suite benchmarks/formal_eval/sealed/deterministic-suite.json
          --required-input benchmarks/formal_eval/sealed/mcp-project
          --required-input benchmarks/formal_eval/sealed/pilot-agent-results.json
          --current-commit "$JOINLINT_COMMIT"
          --output formal-artifacts/report-readiness.json
          --lineage-output formal-artifacts/report-lineage.json
      - name: Rebuild final report with post-run blinded agreement
        run: >-
          python -m benchmarks.formal_eval.cli score
          --preregistration benchmarks/formal_eval/sealed/preregistration.yaml
          --manifest benchmarks/formal_eval/sealed/manifest.json
          --input-lock benchmarks/formal_eval/sealed/input-lock.json
          --deterministic-suite benchmarks/formal_eval/sealed/deterministic-suite.json
          --deterministic-evidence formal-artifacts/deterministic-evidence.json
          --run-plan formal-artifacts/run-plan.json
          --blind-review formal-review/blind-review.json
          --agent-results formal-artifacts/agent-results.json
          --output final-report
          --require none
      - name: Checkout pinned public artifact verifier
        id: public_artifact_verifier
        if: always()
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 0389c4bd34597f06676d4c560f5e7683fd2b20c9
          path: .workflow-verifier
          persist-credentials: false
      - name: Scan final public artifacts
        id: scan_final_report
        if: steps.public_artifact_verifier.outcome == 'success'
        working-directory: .workflow-verifier
        env:
          PYTHONPATH: ${{ github.workspace }}/.workflow-verifier/src:${{ github.workspace }}/.workflow-verifier
        run: >-
          python -m benchmarks.formal_eval.public_artifacts
          --profile formal-report
          --root "$GITHUB_WORKSPACE/final-report"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: steps.scan_final_report.outcome == 'success'
        with:
          name: formal-evaluation-final-report
          path: final-report
          if-no-files-found: error
          retention-days: 90
