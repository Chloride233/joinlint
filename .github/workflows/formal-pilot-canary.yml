name: formal-pilot-canary

on:
  workflow_dispatch:
    inputs:
      confirm_paid:
        description: Confirm the approved readiness or one-task canary spend
        required: true
        default: false
        type: boolean
      budget_cny:
        description: Hard combined canary budget ceiling in CNY
        required: true
        default: "2.25"
        type: string
      pilot_commit:
        description: Full JoinLint commit bound to the frozen pilot input
        required: true
        default: ""
        type: string
      pilot_release_tag:
        description: Access-controlled Draft Release tag holding the frozen pilot input
        required: true
        default: ""
        type: string
      pilot_release_asset:
        description: Frozen pilot input archive asset name
        required: true
        default: pilot-input.tar.gz
        type: string
      readiness_only:
        description: Run both Modal host-context checks without DeepSeek
        required: true
        default: false
        type: boolean
      calibration:
        description: Run the sealed eight-sample four-cell calibration
        required: true
        default: false
        type: boolean
      campaign_budget_cny:
        description: Approved cumulative investigation budget in CNY
        required: false
        default: ""
        type: string
      campaign_spend_before_cny:
        description: Cumulative investigation spend before this run in CNY
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  readiness:
    if: inputs.readiness_only == true && inputs.calibration != true
    permissions:
      contents: read
    runs-on: ubuntu-latest
    environment: formal-evaluation
    steps:
      - name: Require the exact approved no-model diagnostic
        if: inputs.confirm_paid != true || inputs.budget_cny != '2.10'
        run: exit 1
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Record checked-out commit
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[dev,eval,remote]'
      - name: Run no-model lifecycle and Modal compatibility tests
        run: >-
          python -m pytest -q
          tests/test_formal_eval_lifecycle.py
          tests/test_formal_eval_lifecycle_inspect.py
          tests/test_formal_eval_modal_readiness.py
          tests/test_formal_eval_modal_compat.py
      - name: Run no-model Codex host-context sample
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          PYTHONPATH: ${{ github.workspace }}
        run: >-
          inspect eval
          benchmarks/formal_eval/inspect_task.py@formal_host_context_eval
          --model mockllm/model
          --log-dir modal-readiness-logs/codex
          --max-retries 0
          --max-sandboxes 1
          --display none
          --no-fail-on-error
          --score-on-error
          -T database="$(pwd)/tests/fixtures/chinook/chinook.sqlite"
          -T host=codex
          -T agent_version=0.144.1
          -T dockerfile="$(pwd)/Dockerfile.formal-pilot"
          -T readiness_time_limit=60
          -T evaluation_time_limit=30
          -T sandbox_timeout=120
      - name: Run no-model Claude host-context sample
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          PYTHONPATH: ${{ github.workspace }}
        run: >-
          inspect eval
          benchmarks/formal_eval/inspect_task.py@formal_host_context_eval
          --model mockllm/model
          --log-dir modal-readiness-logs/claude-code
          --max-retries 0
          --max-sandboxes 1
          --display none
          --no-fail-on-error
          --score-on-error
          -T database="$(pwd)/tests/fixtures/chinook/chinook.sqlite"
          -T host=claude_code
          -T agent_version=2.1.212
          -T dockerfile="$(pwd)/Dockerfile.formal-pilot"
          -T readiness_time_limit=60
          -T evaluation_time_limit=30
          -T sandbox_timeout=120
      - name: Verify zero provider tokens and both host-context attestations
        run: >-
          python -m benchmarks.formal_eval.modal_readiness
          --log-dir modal-readiness-logs
          --output modal-readiness-artifacts
          --workflow-run-id "${{ github.run_id }}"
          --joinlint-commit "${{ steps.commit.outputs.sha }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: joinlint-formal-modal-readiness
          path: |
            modal-readiness-artifacts
            modal-readiness-logs
          if-no-files-found: warn
          retention-days: 30

  canary:
    if: inputs.readiness_only != true
    runs-on: ubuntu-latest
    environment: formal-evaluation
    steps:
      - name: Require the exact approved paid diagnostic
        if: >-
          inputs.confirm_paid != true ||
          (inputs.calibration == true && inputs.budget_cny != '4') ||
          (inputs.calibration != true && inputs.budget_cny != '2.25')
        run: exit 1
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.pilot_commit }}
      - name: Record checked-out pilot commit
        id: pilot_commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[dev,eval,remote]'
      - name: Run no-model lifecycle gate
        run: python -m pytest -q tests/test_formal_eval_lifecycle*.py
      - name: Restore private frozen pilot inputs
        env:
          GH_TOKEN: ${{ github.token }}
          PILOT_RELEASE_TAG: ${{ inputs.pilot_release_tag }}
          PILOT_RELEASE_ASSET: ${{ inputs.pilot_release_asset }}
        run: |
          mkdir -p pilot-release benchmarks/formal_eval/sealed/pilot-v1
          gh release download "$PILOT_RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$PILOT_RELEASE_ASSET" \
            --dir pilot-release
          tar -xzf "pilot-release/$PILOT_RELEASE_ASSET" \
            -C benchmarks/formal_eval/sealed/pilot-v1 \
            --no-same-owner --no-same-permissions
      - name: Verify frozen pilot input
        run: >-
          python -m benchmarks.formal_eval.pilot verify
          --root benchmarks/formal_eval/sealed/pilot-v1
          --current-commit "${{ steps.pilot_commit.outputs.sha }}"
      - name: Run one-task canary
        if: inputs.calibration != true
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_BASE_URL: https://api.deepseek.com
        run: >-
          python -m benchmarks.formal_eval.pilot_canary
          run
          --root benchmarks/formal_eval/sealed/pilot-v1
          --log-dir pilot-canary-logs
          --output pilot-canary-artifacts
          --workflow-run-id "${{ github.run_id }}"
      - name: Run sealed four-cell calibration
        if: inputs.calibration == true
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_BASE_URL: https://api.deepseek.com
          CAMPAIGN_BUDGET_CNY: ${{ inputs.campaign_budget_cny }}
          CAMPAIGN_SPEND_BEFORE_CNY: ${{ inputs.campaign_spend_before_cny }}
        run: >-
          python -m benchmarks.formal_eval.pilot_calibration
          run
          --root benchmarks/formal_eval/sealed/pilot-v1
          --log-dir pilot-calibration-logs
          --output pilot-calibration-artifacts
          --workflow-run-id "${{ github.run_id }}"
          --campaign-budget-cny "$CAMPAIGN_BUDGET_CNY"
          --campaign-spend-before-cny "$CAMPAIGN_SPEND_BEFORE_CNY"
      - name: Scan sanitized canary artifacts
        if: always() && inputs.calibration != true
        run: >-
          python -c "from pathlib import Path; text='\n'.join(p.read_text(errors='ignore') for p in Path('pilot-canary-artifacts').rglob('*') if p.is_file()); forbidden=('gold_sql','database_path','schema_text','sk-','DEEPSEEK_API_KEY','MODAL_TOKEN_SECRET'); found=[value for value in forbidden if value in text]; assert not found, found"
      - uses: actions/upload-artifact@v4
        if: always() && inputs.calibration != true
        with:
          name: joinlint-formal-pilot-canary-sanitized
          path: pilot-canary-artifacts
          if-no-files-found: warn
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: always() && inputs.calibration != true
        with:
          name: joinlint-formal-pilot-canary-private-logs
          path: pilot-canary-logs
          if-no-files-found: warn
          retention-days: 30
      - name: Scan sanitized calibration artifacts
        if: always() && inputs.calibration == true
        run: >-
          python -c "from pathlib import Path; text='\n'.join(p.read_text(errors='ignore') for p in Path('pilot-calibration-artifacts').rglob('*') if p.is_file()); forbidden=('gold_sql','database_path','schema_text','sk-','DEEPSEEK_API_KEY','MODAL_TOKEN_SECRET'); found=[value for value in forbidden if value in text]; assert not found, found"
      - uses: actions/upload-artifact@v4
        if: always() && inputs.calibration == true
        with:
          name: joinlint-formal-pilot-calibration-sanitized
          path: pilot-calibration-artifacts
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: always() && inputs.calibration == true
        with:
          name: joinlint-formal-pilot-calibration-private-logs
          path: pilot-calibration-logs
          if-no-files-found: warn
          retention-days: 30
