name: formal-pilot

on:
  workflow_dispatch:
    inputs:
      confirm_paid:
        description: Confirm the approved Modal and DeepSeek pilot spend
        required: true
        default: false
        type: boolean
      budget_cny:
        description: Hard combined budget ceiling in CNY
        required: true
        default: "20"
        type: string
      campaign_budget_cny:
        description: Approved cumulative investigation budget in CNY
        required: true
        default: ""
        type: string
      campaign_spend_before_cny:
        description: Cumulative investigation spend before this Pilot in CNY
        required: true
        default: ""
        type: string
      pilot_commit:
        description: Full JoinLint commit bound to the frozen pilot input
        required: true
        default: 05da3fb4b2fa8536caef7a28cd9994b8b84a98c9
        type: string
      pilot_release_tag:
        description: Access-controlled Draft Release tag holding the frozen pilot input
        required: true
        default: ""
        type: string
      pilot_release_asset:
        description: Frozen pilot input archive asset name
        required: true
        default: pilot-input.tar.gz
        type: string
      calibration_run_id:
        description: Successful bound formal-pilot-calibration workflow run ID
        required: true
        default: ""
        type: string

permissions:
  # Draft Release assets are visible only to repository maintainers. The
  # protected, manually dispatched pilot job needs this scope to restore its
  # frozen input; the workflow never invokes a GitHub write operation.
  contents: write
  actions: read

jobs:
  pilot:
    runs-on: ubuntu-latest
    concurrency:
      group: joinlint-formal-paid-v1
      cancel-in-progress: false
    environment: formal-evaluation
    steps:
      - name: Block paid evaluation pending atomic campaign reservation
        run: exit 1
      - name: Require the exact approved paid pilot
        if: >-
          github.run_attempt != 1 ||
          inputs.confirm_paid != true || inputs.budget_cny != '20'
        run: exit 1
      - name: Require cumulative campaign budget for full pilot
        env:
          CAMPAIGN_BUDGET_CNY: ${{ inputs.campaign_budget_cny }}
          CAMPAIGN_SPEND_BEFORE_CNY: ${{ inputs.campaign_spend_before_cny }}
          CAMPAIGN_COST_UPPER_CNY: "20"
        run: |
          python3 - <<'PY'
          import os
          import re
          import sys
          from decimal import Decimal

          values = [
              os.environ["CAMPAIGN_BUDGET_CNY"],
              os.environ["CAMPAIGN_SPEND_BEFORE_CNY"],
              os.environ["CAMPAIGN_COST_UPPER_CNY"],
          ]
          canonical = re.compile(r"(?:0|[1-9][0-9]*)(?:\.[0-9]{1,6})?\Z")
          if not all(canonical.fullmatch(value) for value in values):
              sys.exit("campaign amounts must be canonical decimal strings")
          budget, spent, upper = map(Decimal, values)
          if budget <= 0 or spent < 0 or upper < 0 or spent + upper > budget:
              sys.exit("full pilot could exceed the approved cumulative campaign budget")
          PY
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.pilot_commit }}
          persist-credentials: false
      - name: Record checked-out pilot commit
        id: pilot_commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[dev,eval,remote]'
      - name: Run no-model lifecycle gate
        run: python -m pytest -q tests/test_formal_eval_lifecycle*.py
      - name: Restore private frozen pilot inputs
        env:
          GH_TOKEN: ${{ github.token }}
          PILOT_RELEASE_TAG: ${{ inputs.pilot_release_tag }}
          PILOT_RELEASE_ASSET: ${{ inputs.pilot_release_asset }}
        run: |
          mkdir -p pilot-release benchmarks/formal_eval/sealed/pilot-v1
          gh release download "$PILOT_RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$PILOT_RELEASE_ASSET" \
            --dir pilot-release
          tar -xzf "pilot-release/$PILOT_RELEASE_ASSET" \
            -C benchmarks/formal_eval/sealed/pilot-v1 \
            --no-same-owner --no-same-permissions
      - name: Verify frozen pilot and budget envelope
        run: >-
          python -m benchmarks.formal_eval.pilot verify
          --root benchmarks/formal_eval/sealed/pilot-v1
          --current-commit "${{ steps.pilot_commit.outputs.sha }}"
      - name: Restore successful calibration attestation
        env:
          GH_TOKEN: ${{ github.token }}
          CALIBRATION_RUN_ID: ${{ inputs.calibration_run_id }}
        run: |
          [[ "$CALIBRATION_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          mkdir -p calibration-attestation
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CALIBRATION_RUN_ID" \
            > calibration-attestation/run.json
          gh run download "$CALIBRATION_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name joinlint-formal-pilot-calibration-sanitized \
            --dir calibration-attestation/artifact
      - name: Verify calibration attestation binding
        env:
          CALIBRATION_RUN_ID: ${{ inputs.calibration_run_id }}
        run: >-
          python -m benchmarks.formal_eval.pilot_calibration
          verify-attestation
          --root benchmarks/formal_eval/sealed/pilot-v1
          --attestation calibration-attestation/artifact/calibration.json
          --run-metadata calibration-attestation/run.json
          --expected-run-id "$CALIBRATION_RUN_ID"
          --current-commit "${{ steps.pilot_commit.outputs.sha }}"
          --repository "$GITHUB_REPOSITORY"
      - name: Run the approved 20-task pilot
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_BASE_URL: https://api.deepseek.com
          CAMPAIGN_BUDGET_CNY: ${{ inputs.campaign_budget_cny }}
          CAMPAIGN_SPEND_BEFORE_CNY: ${{ inputs.campaign_spend_before_cny }}
        run: >-
          python -m benchmarks.formal_eval.pilot_dispatch
          --root benchmarks/formal_eval/sealed/pilot-v1
          --log-dir pilot-logs
          --output pilot-artifacts
          --campaign-budget-cny "$CAMPAIGN_BUDGET_CNY"
          --campaign-spend-before-cny "$CAMPAIGN_SPEND_BEFORE_CNY"
      - name: Checkout pinned public artifact verifier
        id: public_artifact_verifier
        if: always()
        uses: actions/checkout@v4
        with:
          ref: 0389c4bd34597f06676d4c560f5e7683fd2b20c9
          path: .workflow-verifier
          persist-credentials: false
      - name: Scan sanitized pilot artifacts
        id: scan_pilot_sanitized
        if: >-
          always() &&
          steps.public_artifact_verifier.outcome == 'success'
        working-directory: .workflow-verifier
        env:
          PYTHONPATH: ${{ github.workspace }}/.workflow-verifier/src:${{ github.workspace }}/.workflow-verifier
        run: >-
          python -m benchmarks.formal_eval.public_artifacts
          --profile pilot
          --root "$GITHUB_WORKSPACE/pilot-artifacts"
      - uses: actions/upload-artifact@v4
        if: always() && steps.scan_pilot_sanitized.outcome == 'success'
        with:
          name: joinlint-formal-pilot-sanitized
          path: pilot-artifacts
          if-no-files-found: error
          retention-days: 90
